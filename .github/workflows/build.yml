name: Build Container

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '.github/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Bump tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          fetch-tags: true
      - id: bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 main | head -n 1)
          COMMIT_DESC=$(git log --format=%B -n 1 "${{github.sha}}")
          NEW_TAG="v$(( ${LATEST_TAG//v} + 1 ))"

          echo "::notice ::Latest git tag is: '$LATEST_TAG'"
          echo "::notice ::New tag: $NEW_TAG pointing to commit: $COMMIT_DESC"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git tag -a "${NEW_TAG}" -m "[${NEW_TAG}]: $COMMIT_DESC"
          git push origin "$NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: [ tag ]
    name: Build docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------
      # Configure your container registry here.
      # The example below uses GitHub Container Registry (ghcr.io).
      # Replace with ECR, DockerHub, etc. as needed.
      # ---------------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VERSION=${{needs.tag.outputs.tag}}
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{needs.tag.outputs.tag}}
            ghcr.io/${{ github.repository }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
