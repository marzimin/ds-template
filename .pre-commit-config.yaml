default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args:
          - -c
          - backend/pyproject.toml
          - --severity-level
          - high
          - -x
          - .venv,backend/tests

  # Hooks run from the repository root, so ty is pointed at the backend
  # project explicitly: its config lives in backend/pyproject.toml and its
  # imports are rooted at backend/ (`from src.ml...`). Unlike the old mypy
  # hook, ty always checks the whole project rather than just the files in a
  # commit — a change in one file can surface new diagnostics in another.
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      - id: ty
        args: ["--project", "backend"]
