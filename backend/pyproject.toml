[project]
name = "ds-template"
version = "0.0.1"
description = "Data science project template"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=23.0.1",
    "mlflow>=3.15.0",
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "seaborn>=0.13",
    "pandera>=0.18",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
]

# ── Optional dependency groups ─────────────────────────────────────────────
# PEP 735 groups, matching de-template so the two projects are installed the
# same way. `uv sync` includes `dev` by default; `uv sync --no-dev` excludes it,
# which is what the Dockerfile relies on to keep pytest and jupyterlab out of
# the runtime image. As `[project.optional-dependencies]` these were extras, and
# `--no-dev` had nothing to act on.
[dependency-groups]
dev = [
    "pre-commit>=3.0",
    "pytest>=9.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.69",
    "types-PyYAML>=6.0",
    "ipykernel>=6.0",
    "jupyterlab>=4.5.10",
]

[project.scripts]
pipeline = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F/I/D was this project's baseline; UP and B come from de-template, so code
# reads the same way in both repositories.
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["E203", "E266", "E501", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names.
"tests/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
