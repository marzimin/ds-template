[project]
name = "ds-template"
version = "0.0.1"
description = "Data science project template"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=23.0.1",
    "mlflow>=2.17",
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "seaborn>=0.13",
    "pandera>=0.18",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0",
    "pytest>=9.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "ipykernel>=6.0",
    "jupyterlab>=4.5.9",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
]

[project.scripts]
pipeline = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["E203", "E266", "E501", "D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# Imports are rooted at backend/ (`from src.ml...`). Declaring it here keeps
# mypy working both from backend/ (`uv run mypy .`) and from the repository root
# (the pre-commit hook), where the config path is passed explicitly.
mypy_path = "backend"
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
