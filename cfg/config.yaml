data:
  dir: "data/processed"
  raw_dir: "data/raw"
  input_file: "input_data.csv"

target_column: "TARGET"
target_values: [0, 1] # default pipeline metrics expect binary classification

# MLflow experiment and Model Registry names. Both default to the project name
# in backend/pyproject.toml, so renaming the project renames them too. Set
# either key here to override.
tracking:
  experiment_name: null
  registered_model_name: null

model_registry:
  xgboost: "xgboost.XGBClassifier"
  xgb: "xgboost.XGBClassifier"
  random_forest: "sklearn.ensemble.RandomForestClassifier"
  rf: "sklearn.ensemble.RandomForestClassifier"

model_name: "xgboost" # choose from model_registry
model_params:
  n_estimators: 50
  max_depth: 10
  # class_weights: "balanced"

stratify: false
test_size: 0.2
